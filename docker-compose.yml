# version: '3.8'
# 
services:

  web:
    container_name: password_generator
    build:
      context: ./services/web
      dockerfile: Dockerfile
    command: gunicorn --bind 0.0.0.0:5000 --workers 3 --no-control-socket manage:app
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:8085:5000
    restart: unless-stopped
