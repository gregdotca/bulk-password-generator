<!doctype html>
<html lang="en">
<head>
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_title }}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
    {% include 'custom.headers' ignore missing %}
    <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet" type="text/css" />
</head>
<body class="p-8">
<div id="content">
    <h1 class="text-2xl mb-3"><a href="/">{{ app_title }}</a></h1>
    <form method="POST" action="/" class="pb-7">
        <div class="flex">
            <fieldset class="fieldset bg-base-200 border border-base-300 p-10 -ml-1 rounded-box">
                <label>Number of Passwords<BR>
                <input id="number_of_passwords" class="input mt-1" type="number" min="1" max="{{ max_number_of_passwords }}" name="number_of_passwords" placeholder="Default 30" autofocus></label>
                <BR>
                <label>Password Length<BR>
                <input id="password_length" class="input mt-1" type="number" min="1" max="{{ max_password_length }}" name="password_length" placeholder="Default 16"></label>
                <label for="exclude_special" class="pt-5 pb-5">Exclude special?&nbsp;&nbsp;<input id="exclude_special" type="checkbox" name="exclude_special" value="1"></label>
                <input class="btn btn-accent dark:btn-primary" type="submit" name="submit" value="Generate">
            </fieldset>
        </div>
    </form>
</div>
</body>
</html>
